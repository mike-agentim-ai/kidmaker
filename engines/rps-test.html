<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>RPS Engine Test</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1030; overflow: hidden; }
    #app { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createGame } from './rps.js';

    const spec = {
      genre: 'rps',
      language: 'he',
      levels: 3,
      title: 'אבן נייר ומספריים',
      goal: 'best-of',
      theme: 'playful',
    };

    const mount = document.getElementById('app');
    const game = createGame(spec, {}, mount);
    game.start();

    // Expose for manual teardown testing in console.
    window.__rpsGame = game;
  </script>
</body>
</html>
