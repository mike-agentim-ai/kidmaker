<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Tic-Tac-Toe test</title>
  <style>
    html,body{margin:0;padding:0;height:100%;background:#151030;}
    #app{position:fixed;inset:0;}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createGame } from './tictactoe.js';
    const spec = { genre: 'tictactoe', language: 'he', levels: 3, title: 'איקס עיגול' };
    const game = createGame(spec, {}, document.getElementById('app'));
    game.start();
    window.__game = game; // for manual destroy() testing in console
  </script>
</body>
</html>
